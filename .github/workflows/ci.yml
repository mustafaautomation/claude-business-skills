name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest
      - name: Package skill zips
        run: python scripts/package_skills.py

  # The live judge in evals/test_llm_judge.py calls the API only when
  # ANTHROPIC_API_KEY is set. This workflow does not set it, so that test skips.
